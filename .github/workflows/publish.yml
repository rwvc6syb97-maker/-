name: Build and publish to GitHub Pages

# 本仓库的 Pages 源是「main 分支 + /docs 文件夹」，不是 GitHub Actions。
# 所以这个工作流不直接部署，而是：构建 -> 把产物写进 docs/ -> 提交回 main。
# Pages 检测到 main 有新提交后会自动重新发布。
#
# 站点地址：https://rwvc6syb97-maker.github.io/-/
#
# 如果你希望改成「Actions 直接部署」的模式，需要先把
# Settings -> Pages -> Build and deployment -> Source 改成 "GitHub Actions"，
# 之后才能使用 actions/deploy-pages。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and copy into docs/
        run: npm run deploy

      - name: Commit and push if the build changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "构建产物无变化，跳过提交。"
          else
            git commit -m "chore: publish site build to docs [skip ci]"
            git push
          fi
